name: Deploy to VPS

# Push to main -> SSH into the Hostinger VPS, pull, build, reload the ATS.
# Requires repo secret VPS_SSH_KEY (a private key whose public key is in the
# VPS's ~/.ssh/authorized_keys). See DEPLOY.md in the scoutforu-crm repo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 200.141.9.192
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "15m"
          script: |
            set -e
            cd /opt/scoutforu-ats
            # Hard-reset to origin instead of `git pull --ff-only`: `npm install`
            # rewrites package-lock.json each run, leaving the tree dirty, which
            # made the next fast-forward pull abort. Resetting is self-healing.
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 reload ats
            echo "ATS deployed."
